[package]
name = "md-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A quiet desktop Markdown preview for Neovim"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
ammonia = "4.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", optional = true, features = ["custom-protocol"] }

[build-dependencies]
tauri-build = { version = "2.7.4", optional = true }

[[bin]]
name = "md-viewer"
path = "src/main.rs"
required-features = ["desktop"]
